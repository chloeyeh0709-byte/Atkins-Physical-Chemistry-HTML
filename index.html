<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化學講義 | 選擇教科書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Noto Serif TC',serif;
  background:#1a1f27;
  color:#e8e2d8;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  text-align:center;
  padding:64px 24px 40px;
}
header h1{
  font-family:'Noto Sans TC',sans-serif;
  font-size:1.6rem;
  font-weight:700;
  margin:0 0 10px;
  letter-spacing:.08em;
  color:#f0ebe0;
}
header p{
  font-family:'Noto Sans TC',sans-serif;
  font-size:.9rem;
  color:#6b7a8a;
  margin:0;
  letter-spacing:.04em;
}
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 24px 80px;
}
.book-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  max-width:760px;
  width:100%;
}
.book-card{
  background:#22282f;
  border:1px solid #2e3845;
  border-radius:12px;
  text-decoration:none;
  color:inherit;
  display:flex;
  flex-direction:column;
  padding:36px 32px;
  transition:transform .18s, box-shadow .18s, border-color .18s;
  position:relative;
  overflow:hidden;
}
.book-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
}
.book-card.physical::before{background:#c0392b;}
.book-card.organic::before{background:#27ae60;}
.book-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  border-color:#3e4f62;
}
.book-card .label{
  font-family:'Noto Sans TC',sans-serif;
  font-size:.72rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:14px;
}
.book-card.physical .label{color:#c0392b;}
.book-card.organic .label{color:#27ae60;}
.book-card h2{
  font-family:'Noto Sans TC',sans-serif;
  font-size:1.3rem;
  font-weight:700;
  margin:0 0 8px;
  color:#f0ebe0;
  line-height:1.35;
}
.book-card .subtitle{
  font-family:'Noto Sans TC',sans-serif;
  font-size:.8rem;
  color:#6b7a8a;
  margin:0 0 20px;
  line-height:1.5;
}
.book-card .chapter-count{
  font-family:'Noto Sans TC',sans-serif;
  font-size:.8rem;
  color:#8b96a3;
  margin-top:auto;
  padding-top:20px;
  border-top:1px solid #2e3845;
}
.book-card .chapter-count strong{
  font-size:1.4rem;
  font-weight:700;
  display:block;
  margin-bottom:2px;
}
.book-card.physical .chapter-count strong{color:#c0392b;}
.book-card.organic .chapter-count strong{color:#27ae60;}
.arrow{
  position:absolute;
  bottom:28px;
  right:28px;
  font-size:1.2rem;
  opacity:.4;
  transition:opacity .18s, right .18s;
}
.book-card:hover .arrow{opacity:.9;right:24px;}
@media(max-width:600px){
  .book-grid{grid-template-columns:1fr;}
  header{padding:40px 24px 24px;}
  .book-card{padding:28px 24px;}
}
</style>
</head>
<body>
<header>
<h1>化學講義</h1>
<p>繁體中文互動講義・Traditional Chinese Study Notes</p>
</header>
<main>
<div class="book-grid">
<a class="book-card physical" href="physical/index.html">
<div class="label">物理化學</div>
<h2>Atkins' Physical Chemistry</h2>
<div class="subtitle">系統性物理化學講義<br>含熱力學、量子力學、統計力學、動力學</div>
<div class="chapter-count">
<strong>25</strong>
章節・第一章至第二十五章
</div>
<span class="arrow">→</span>
</a>
<a class="book-card organic" href="organic/index.html">
<div class="label">有機化學</div>
<h2>Clayden's Organic Chemistry</h2>
<div class="subtitle">有機結構與反應機制<br>含譜學分析、軌域理論、彎箭頭機制</div>
<div class="chapter-count">
<strong>5</strong>
章節・第一章至第五章
</div>
<span class="arrow">→</span>
</a>
</div>
</main>
</body>
</html>
